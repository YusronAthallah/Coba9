<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Paket Soal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('games.jpg') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      color: #00796b;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeSlideIn 0.6s ease-out forwards;
    }

    .paket-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 800px;
    }

    .paket-card {
      background: white;
      padding: 20px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      flex: 1 1 200px;
      opacity: 0;
      animation: fadeSlideIn 0.6s ease-out forwards;
    }

    .paket-card:nth-child(1) { animation-delay: 0.2s; }
    .paket-card:nth-child(2) { animation-delay: 0.3s; }
    .paket-card:nth-child(3) { animation-delay: 0.4s; }
    .paket-card:nth-child(4) { animation-delay: 0.5s; }
    .paket-card:nth-child(5) { animation-delay: 0.6s; }

    .paket-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.2);
    }

    .paket-card h2 {
      font-size: 1.5rem;
      color: #0288d1;
      margin: 0;
    }

    .kembali-button {
      display: inline-block;
      margin-top: 40px;
      padding: 12px 24px;
      background-color: #007BFF;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.3s;
    }

    .kembali-button:hover {
      background-color: #0056b3;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.5rem;
      }

      .paket-card {
        padding: 15px 20px;
      }

      .paket-card h2 {
        font-size: 1.2rem;
      }
    }

    /* MODAL STYLING */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      display: none;
    }

    .modal.show {
      display: flex;
      animation: fadeIn 0.3s ease-out forwards;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 90%;
      width: 300px;
      transform: scale(0.8);
      opacity: 0;
      animation: scaleIn 0.3s ease-out forwards;
    }

    .modal-content h3 {
      margin-bottom: 15px;
      font-size: 1.2rem;
      color: #00796b;
    }

    .modal-content input {
      padding: 10px;
      width: 100%;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .modal-content button {
      padding: 10px 20px;
      border: none;
      background: #0288d1;
      color: white;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .modal-content button:hover {
      background: #0277bd;
    }

    #toggleSound {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background-color: #00796b;
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* ANIMATIONS */
    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <h1>Pilih Paket Soal</h1>
  <div class="paket-container">
    <div class="paket-card" onclick="showModal(1)">
      <h2>Paket 1</h2>
    </div>
    <div class="paket-card" onclick="showModal(2)">
      <h2>Paket 2</h2>
    </div>
    <div class="paket-card" onclick="showModal(3)">
      <h2>Paket 3</h2>
    </div>
    <div class="paket-card" onclick="showModal(4)">
      <h2>Paket 4</h2>
    </div>
    <div class="paket-card" onclick="showModal(5)">
      <h2>Paket 5</h2>
    </div>
  </div>

  <a href="home.html" class="kembali-button">Kembali ke Beranda</a>

  <!-- MODAL -->
  <div id="passwordModal" class="modal">
    <div class="modal-content">
      <h3>Masukkan Password Paket <span id="paketNomor"></span></h3>
      <input type="password" id="passwordInput" placeholder="Password...">
      <button onclick="cekPassword()">Kirim</button>
    </div>
  </div>

  <!-- AUDIO -->
  <audio id="bgAudio" autoplay loop>
    <source src="paket.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- TOMBOL SOUND -->
  <button id="toggleSound">🔊 Suara Menyala</button>

  <script>
    const passwords = {
      1: "paket1pass",
      2: "paket2pass",
      3: "paket3pass",
      4: "paket4pass",
      5: "paket5pass"
    };

    let paketDipilih = null;

    function showModal(paket) {
      paketDipilih = paket;
      document.getElementById('paketNomor').textContent = paket;
      const modal = document.getElementById('passwordModal');
      modal.classList.add('show');
      document.getElementById('passwordInput').value = '';
      setTimeout(() => {
        document.getElementById('passwordInput').focus();
      }, 100);
    }

    function cekPassword() {
      const input = document.getElementById('passwordInput').value;
      if (input === passwords[paketDipilih]) {
        window.location.href = `pertanyaan.html?paket=${paketDipilih}`;
      } else {
        alert("Password salah. Coba lagi.");
      }
    }

    window.addEventListener('click', function(e) {
      const modal = document.getElementById('passwordModal');
      const content = document.querySelector('.modal-content');
      if (e.target === modal) {
        modal.classList.remove('show');
      }
    });

    // Kontrol suara
    const audio = document.getElementById('bgAudio');
    const toggleBtn = document.getElementById('toggleSound');

    toggleBtn.addEventListener('click', () => {
      if (audio.muted) {
        audio.muted = false;
        toggleBtn.textContent = "🔊 Suara Menyala";
      } else {
        audio.muted = true;
        toggleBtn.textContent = "🔇 Suara Mati";
      }
    });
  </script>
</body>
</html>
