      color: #444;
    }

    .option {
      background-color: #f2f2f2;
      padding: 12px 20px;
      margin: 10px auto;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      max-width: 500px;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      font-weight: 500;
    }

    .option:hover {
      background-color: #e0e0e0;
      transform: scale(1.02);
    }

    .correct {
      background-color: #d4edda !important;
      border-color: #28a745;
      color: #155724;
    }

    .wrong {

      color: #721c24;
    }

    #next-btn {

      margin-top: 25px;

      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;

    #next-btn:hover {

      }

      #soal-teks {

      }

      #next-btn {

        font-size: 15px;
      }
    }
  </style>

    let indexSoal = 0;

    function tampilkanSoal() {
      nextBtn.style.display = "none";
      opsiContainer.innerHTML = "";
      const current = soalPaket[indexSoal];
      soalTeks.textContent = `${indexSoal + 1}. ${current.soal}`;

      current.pilihan.forEach((opsi, i) => {
        const div = document.createElement("div");
        div.textContent = `${String.fromCharCode(97 + i)}. ${opsi}`;
        div.className = "option";
        div.onclick = () => pilihJawaban(i, div, current.benar);
        opsiContainer.appendChild(div);
      });
    }

    function pilihJawaban(pilihanIndex, elemen, jawabanBenar) {
  const opsiDivs = document.querySelectorAll(".option");
  const soundCorrect = document.getElementById("sound-correct");
  const soundWrong = document.getElementById("sound-wrong");

  opsiDivs.forEach((div, i) => {
    div.onclick = null; // Disable klik ulang
    if (i === jawabanBenar) {
      div.classList.add("correct");
    }
    if (i === pilihanIndex && i !== jawabanBenar) {
      div.classList.add("wrong");
    }
  });

  // Play sound
    if (pilihanIndex === jawabanBenar) {
    console.log("Jawaban benar - mainkan suara benar");
    soundCorrect.play().catch(err => console.error("Gagal play benar:", err));
  } else {
    console.log("Jawaban salah - mainkan suara salah");
    soundWrong.play().catch(err => console.error("Gagal play salah:", err));
  }


  nextBtn.style.display = "inline-block";
}

    function nextSoal() {

window.addEventListener('load', () => {
  bgMusic.play().catch(() => {

    toggleBtn.textContent = '▶️';

});

toggleBtn.addEventListener('click', () => {
  if (bgMusic.paused) {
    bgMusic.play();
    toggleBtn.textContent = '🔊';
  } else {
    bgMusic.pause();
    toggleBtn.textContent = '🔇';
  }
});
