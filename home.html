<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f3f3;
            background: url('home.png') no-repeat center center/cover;
            margin: 0;
            padding: 20px;
        }

        a{
            font-size: x-large;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeSlideIn 1s ease-out forwards;
        }

        @keyframes fadeSlideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            width: 220px;
            height: 300px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            color: black;
            font-weight: bold;
            opacity: 0.9;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0px 6px 10px rgba(0, 0, 0, 0.15);
        }

        .sound-control {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            z-index: 10;
        }

        .sound-control:hover {
            color: #28a745;
        }

        /* Responsive layout */
        @media (max-width: 768px) {
            .card {
                width: 45%;
                height: 250px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .card {
                width: 100%;
                height: 200px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <audio id="bg-audio" autoplay loop>
        <source src="Glosarium.mp3" type="audio/mpeg">
    </audio>

    <button class="sound-control" id="soundBtn" onclick="toggleSound()">🔊</button>

    <div class="container">
        <a href="materi1.html" class="card">Materi</a>
        <a href="materi2.html" class="card">Studi Kasus</a>
        <a href="paket.html" class="card">Games</a>
        <a href="glosarium.html" class="card">Glosarium</a>
    </div>

    <script>
        const audio = document.getElementById("bg-audio");
        const soundBtn = document.getElementById("soundBtn");

        function toggleSound() {
            if (audio.paused) {
                audio.play();
                soundBtn.textContent = "🔊";
            } else {
                audio.pause();
                soundBtn.textContent = "🔇";
            }
        }
    </script>   
</body>
</html>
